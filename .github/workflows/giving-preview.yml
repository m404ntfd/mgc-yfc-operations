name: OFFICE Giving preview checks
on:
  pull_request:
    paths:
      - 'giving.py'
      - 'server.py'
      - 'static/**'
      - 'prepare_web_assets.py'
      - 'test_giving*'
      - 'test_office_status_ui.py'
      - '.github/workflows/giving-preview.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  giving:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-push.txt cryptography playwright
      - run: python prepare_web_assets.py
      - run: node --check static/pos.js
      - run: node --check static/giving-office.js
      - name: Verify Giving endpoints, history and data integrity
        run: python -m unittest test_giving_history test_giving_donors test_giving_deliveries test_giving test_giving_storage test_web_assets test_data_integrity test_startup_updates
      - uses: actions/checkout@v4
        with:
          ref: d263fb1c97feefb7c1666d7362ccdba60b57738c
          path: .giving-upgrade-baseline
      - name: Verify populated upgrade, backup and rollback
        env:
          RETAIL_BASE_SOURCE: ${{ github.workspace }}/.giving-upgrade-baseline
        run: python test_giving_upgrade.py
      - name: Install Chromium for browser checks
        run: python -m playwright install chromium
      - run: python -m unittest test_giving_donor_review_ui test_giving_plan_history_ui test_giving_correction_ui test_giving_delivery_ui -v
      - run: python test_giving_ui.py
      - run: python test_office_navigation_ui.py
      - run: python test_office_status_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-giving-previews
          path: output/preview/OFFICE-Giving-*.png
