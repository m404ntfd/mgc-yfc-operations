name: Test and release MGC YFC Operations
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: thrift-mart-dispatch-release
  cancel-in-progress: true
jobs:
  giving:
    uses: ./.github/workflows/giving-preview.yml
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-push.txt
      - run: python prepare_web_assets.py
      - run: python -m unittest test_server test_updater test_remote test_lockout test_journal test_receipts test_daily_session test_native_revision test_login_counts test_revision29 test_page_colors test_receipt_assignment test_roles test_comms test_workforce test_web_push test_web_assets test_mobile_media test_store_ops_review test_computer_updates test_computer_native test_terminal_registration test_startup_updates test_desktop_connection test_store_checkout test_product_tax_checkout
      - run: node --check static/app.js
      - run: node --check static/pos.js
      - run: python -m unittest test_cash_advances test_thrift_retail.ThriftTests test_retail_stores.StoreTests test_pickup_followup.PickupTests test_hr_catalog test_catalog_hierarchy test_hr_browser test_hr_completion test_hr_formats test_hr_sources
      - run: python -m unittest test_schedule_redesign test_data_integrity test_update_connections test_update_coordination test_activity_controller test_pos test_pos_quantity.QuantityTests test_pos_credit test_pos_kiosk test_pos_updates
  mobile-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install playwright -r requirements-push.txt
      - run: python prepare_web_assets.py
      - name: Use reliable Ubuntu dependency downloads
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "2";\n' | sudo tee /etc/apt/apt.conf.d/80download-timeouts
      - run: python -m playwright install --with-deps chromium webkit
        timeout-minutes: 15
      - run: python test_mobile.py
      - run: python test_purpose_ui.py
      - run: python test_revision28.py
      - run: python test_revision29_ui.py
      - run: python test_page_colors_ui.py
      - run: python test_receipt_assignment_ui.py
      - run: python test_roles_ui.py
      - run: python test_comms_ui.py
      - run: python test_workforce_ui.py
      - run: python test_schedule_redesign_ui.py
      - run: python test_update_connections_ui.py
      - run: python test_user_settings_ui.py
      - run: python test_update_coordination_ui.py
      - run: python test_activity_controller_ui.py
      - run: python test_pos_ui.py
      - run: python test_pos_product_start_ui.py
      - run: python test_store_checkout_ui.py
      - run: python test_product_tax_checkout_ui.py
      - run: python test_desk_touch_ui.py
      - run: python test_pos_kiosk_ui.py
      - run: python test_pos_credit_ui.py
      - run: python test_retail_office_ui.py
      - run: python -m unittest test_retail_terminals test_retail_workflows test_retail_finance test_customer_services test_office_expansion
      - run: python test_retail_terminals_ui.py
      - run: python test_retail_workflows_ui.py
      - run: python test_customer_services_ui.py
      - run: python test_thrift_retail_ui.py
      - run: python test_retail_stores_ui.py
      - run: python test_cash_advances_ui.py
      - run: python test_pickup_followup_ui.py
      - run: python test_office_security_reports_ui.py
      - run: python test_hr_catalog_ui.py
      - run: python test_catalog_hierarchy_ui.py
      - run: python test_setup_list_ui.py
      - run: python test_office_search_ui.py
      - run: python test_office_navigation_ui.py
      - run: python test_hr_browser_ui.py
      - run: python test_hr_sources_ui.py
      - run: python test_office_expansion_ui.py
      - run: python test_store_ops_ui.py
      - run: python test_computer_updates_ui.py
      - run: python test_office_web_updates_ui.py
      - run: python test_terminal_registration_ui.py
      - run: python test_computer_auto_ui.py
      - run: python test_pos_redesign_ui.py
      - run: python test_pos_updates_ui.py
      - run: python test_daily.py
      - run: python test_login.py
      - run: python test_mobile_intro.py
      - run: python test_mobile_autoplay.py
        env:
          TEST_WEBKIT: '1'
      - run: python test_desktop_links.py
      - run: python test_sections.py
      - run: python test_receipt_ui.py
      - run: python test_security_ui.py
      - run: python test_appearance.py
      - run: python test_theme_contrast.py
      - run: python test_settings_revision.py
      - run: python test_video_status.py
  windows-installer:
    needs: [test, mobile-browser, giving]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-push.txt pyinstaller==6.22.3 pystray==0.19.5 Pillow pywebview==6.1
      - run: python prepare_web_assets.py
      - run: python test_startup_updates_ui.py
      - run: python test_desktop_connection_ui.py
      - run: python test_pos_native.py
      - run: python test_retail_office_native.py
      - run: python test_store_ops_native.py
      - run: python assets/create_icon.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --icon assets/remote.ico --add-data "assets/remote.ico:assets" --paths . --name "MGC YFC Operations Remote Manager" remote/remote_manager.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --icon assets/dispatch.ico --add-data "assets/dispatch.ico:assets" --add-data "assets/dispatch.png:assets" --hidden-import pystray._win32 --name "MGC YFC Operations Server" server_desktop.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --console --icon assets/dispatch.ico --add-data "assets/dispatch.ico:assets" --add-data "assets/dispatch.png:assets" --hidden-import pystray._win32 --name "MGC YFC Operations Server Console" server_desktop.py
      - name: Verify Remote Manager and restore utility startup
        shell: pwsh
        run: |
          $exe = Join-Path $pwd 'dist/MGC YFC Operations Remote Manager.exe'
          foreach ($arg in @('--smoke-test','--restore-self-test')) {
            $p = Start-Process -WindowStyle Hidden -FilePath $exe -ArgumentList $arg -PassThru
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Remote Manager smoke test timed out" }
            if ($p.ExitCode -ne 0) { throw "Remote Manager smoke test failed" }
          }
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --icon assets/desk.ico --name "MGC YFC Point of Sale" pos_desktop.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --icon assets/office.ico --name "CoastYouth Retail OFFICE" office_desktop.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --icon assets/store-ops.ico --name "CoastYouth Retail STORE OPS" store_ops_desktop.py
      - name: Verify OFFICE launcher
        shell: pwsh
        run: |
          $p = Start-Process -WindowStyle Hidden -FilePath 'dist/CoastYouth Retail OFFICE.exe' -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'OFFICE launcher test failed' }
      - name: Verify POS launcher
        shell: pwsh
        run: |
          $p = Start-Process -WindowStyle Hidden -FilePath 'dist/MGC YFC Point of Sale.exe' -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'POS launcher test failed' }
      - run: python installer/prepare_runtime.py
      - run: python build_release.py
      - name: Verify populated release upgrade and rollback
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'retail-upgrade-baseline'
          git clone --depth 1 --branch v0.58.2 https://github.com/m404ntfd/mgc-yfc-operations.git $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Baseline checkout failed' }
          $env:RETAIL_BASE_SOURCE = $baseline
          python test_retail_release_upgrade.py
          if ($LASTEXITCODE -ne 0) { throw 'Populated data-preservation check failed' }
      - name: Build unified installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          $version = (Get-Content VERSION).Trim()
          & $compiler "/DAppVersion=$version" installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          & $compiler installer/pos.iss
          if ($LASTEXITCODE -ne 0) { throw "POS installer build failed" }
          & $compiler installer/office.iss
          if ($LASTEXITCODE -ne 0) { throw "OFFICE installer build failed" }
          & $compiler installer/store_ops.iss
          if ($LASTEXITCODE -ne 0) { throw "STORE OPS installer build failed" }
          & $compiler "/DAppVersion=$version" installer/suite.iss
          if ($LASTEXITCODE -ne 0) { throw "Computer setup installer build failed" }
          $officeInstall = Join-Path $env:RUNNER_TEMP 'OfficeInstallTest'
          $p = Start-Process -WindowStyle Hidden -FilePath 'dist/CoastYouth-Retail-OFFICE-Setup-v1.15.0.exe' -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$officeInstall") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'OFFICE install failed' }
          $p = Start-Process -WindowStyle Hidden -FilePath (Join-Path $officeInstall 'CoastYouth Retail OFFICE.exe') -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Installed OFFICE failed' }
          $posInstall = Join-Path $env:RUNNER_TEMP 'PosInstallTest'
          $p = Start-Process -WindowStyle Hidden -FilePath 'dist/MGC-YFC-POS-Setup-v1.18.0.exe' -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$posInstall") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'POS install failed' }
          $p = Start-Process -WindowStyle Hidden -FilePath (Join-Path $posInstall 'MGC YFC Point of Sale.exe') -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Installed POS failed' }
      - run: python test_pos_self_update.py
      - run: python installer/test_suite_errors.py
      - run: python installer/test_suite_install.py
      - name: Test installed server and remote connection
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $setup = Join-Path $pwd "dist/MGC-YFC-Operations-Setup-v$version.exe"
          $install = Join-Path $env:RUNNER_TEMP 'DispatchInstallTest'
          $p = Start-Process -WindowStyle Hidden -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TYPE=both',"/DIR=$install") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer smoke test failed" }
          # Reinstall over sentinel customer data to catch accidental upgrade deletion.
          $dataDir = Join-Path $install 'data'
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          foreach ($name in @('schedule.db','updates.json','backup-settings.json')) {
            Set-Content -Path (Join-Path $dataDir $name) -Value "upgrade-preservation-$name"
          }
          $before = Get-ChildItem $dataDir -File | Get-FileHash
          $p = Start-Process -WindowStyle Hidden -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TYPE=both',"/DIR=$install") -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Upgrade install failed" }
          foreach ($file in $before) {
            if ((Get-FileHash $file.Path).Hash -ne $file.Hash) { throw "Upgrade changed customer data" }
          }
          python installer/smoke_install.py "$install"
          if ($LASTEXITCODE -ne 0) { throw "Installed server test failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: dispatch-release
          path: |
            dist/MGC-YFC-Operations-Setup-*.exe
            dist/MGC-YFC-POS-Setup-*.exe
            dist/Store-Dispatch-Update.zip
            dist/CoastYouth-Retail-OFFICE-Setup-*.exe
            dist/CoastYouth-Retail-STORE-OPS-Setup-*.exe
            dist/CoastYouth-Retail-Computer-Setup-*.exe
          if-no-files-found: error
  release:
    needs: windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dispatch-release
          path: dist
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; leaving published assets unchanged."
            exit 0
          fi
          gh release create "$tag" dist/*.exe dist/Store-Dispatch-Update.zip --target "$GITHUB_SHA" --title "CoastYouth Retail Combined Update $tag" --notes-file RELEASE-NOTES.md
